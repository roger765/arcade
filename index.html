<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unleashed Arcade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --surface: #131326;
      --border: #252545;
      --text: #e0e0ff;
      --muted: #6060a0;
      --blue: #5b8dee;
      --pink: #ee5b8d;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 32px 20px;
      gap: 48px;
    }

    header { text-align: center; }

    .wordmark {
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--blue) 30%, var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 680px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 28px 32px;
      gap: 10px;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }

    .game-card:active { transform: scale(0.96); }

    @media (hover: hover) {
      .game-card:hover {
        transform: translateY(-5px);
        border-color: var(--card-accent);
        box-shadow: 0 8px 32px color-mix(in srgb, var(--card-accent) 20%, transparent);
      }
    }

    .game-card:nth-child(1) { --card-accent: var(--blue); }
    .game-card:nth-child(2) { --card-accent: var(--pink); }

    .game-icon { font-size: 4rem; line-height: 1; }

    .game-name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin-top: 6px;
    }

    .game-desc {
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .play-btn {
      display: block;
      margin-top: 16px;
      padding: 12px 40px;
      border-radius: 10px;
      background: var(--card-accent);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    footer {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">Unleashed</div>
    <p class="tagline">Arcade</p>
  </header>

  <main class="game-grid">
    <a href="/unleashed/" class="game-card">
      <div class="game-icon">⚔️</div>
      <h2 class="game-name">Unleashed</h2>
      <p class="game-desc">Real-time multiplayer brawler.<br>Play with friends online.</p>
      <span class="play-btn">Play</span>
    </a>
    <a href="/bloons/" class="game-card">
      <div class="game-icon">🎈</div>
      <h2 class="game-name">Monkey Bloons</h2>
      <p class="game-desc">Tower defence. 20 monkeys,<br>10 maps, endless upgrades.</p>
      <span class="play-btn">Play</span>
    </a>
  </main>

  <footer>unleashed.bond</footer>
</body>
</html>
