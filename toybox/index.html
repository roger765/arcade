<title>Toybox Brawl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one 16:9 game screen (canvas) with DOM overlays for menus, key help underneath. Single dark arcade look by choice. */
:root {
  --bg: #120f1f;
  --panel: #1d1833;
  --fg: #f4f1ff;
  --dim: #a59fc4;
  --smash: #ff6a3d;
  --speed: #2fd3ff;
  --brawl: #9be22d;
  --common: #d8d4ea;
  --rare: #4d8dff;
  --epic: #b45cff;
  --legend: #ffc93c;
  --special: #ff5ad8;
  --heart: #ff4d6a;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  overflow: hidden;
}
/* The game covers the whole window. The canvas widens its world to match the window shape (see resize()). */
#stage { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: 0; right: 0; background: var(--bg); }
#cv { width: 100%; height: 100%; display: block; object-fit: contain; background: var(--panel); }
.fs { font-family: var(--display); font-size: 12px; background: #2c2547; color: var(--fg); border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.fs:focus-visible { outline: 3px solid var(--legend); outline-offset: 2px; }
#ov { position: absolute; inset: 0; background: #0d0a18b8; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; padding: 18px max(16px, env(safe-area-inset-left, 0px)) 48px; overflow-y: auto; text-align: center; }
#ov[hidden] { display: none !important; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(32px, 7vw, 76px); color: var(--legend); text-shadow: 0 .06em 0 #b04a00, 0 .12em 0 #000; line-height: .95; }
h2 { font-size: clamp(18px, 3.4vw, 34px); text-shadow: 0 .08em 0 #000; }
.sub { color: var(--dim); font-weight: 800; font-size: clamp(12px, 1.6vw, 16px); max-width: 52ch; margin: 0; line-height: 1.45; }
.btn { font-family: var(--display); font-size: clamp(13px, 1.7vw, 18px); background: var(--legend); color: #2a1a00; border: 0; border-radius: 12px; padding: 10px 20px; cursor: pointer; box-shadow: 0 4px 0 #a06a00; }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a06a00; }
.btn.alt { background: #2c2547; color: var(--fg); box-shadow: 0 4px 0 #120f1f; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .pick:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 10px; width: 100%; max-width: 900px; }

/* cards */
.card { --c: var(--common); background: linear-gradient(180deg, #2a2348 0%, var(--panel) 60%); border: 4px solid var(--c); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 5px; position: relative; min-width: 0; text-align: left; color: var(--fg); font-family: var(--body); }
.card.rare { --c: var(--rare); } .card.epic { --c: var(--epic); box-shadow: 0 0 20px #b45cff55; } .card.legendary { --c: var(--legend); box-shadow: 0 0 26px #ffc93c77; }
.card.special { --c: var(--special); box-shadow: 0 0 26px #ff5ad877; }
.card.giant { --c: #ff8a3c; box-shadow: 0 0 26px #ff8a3c88; }
.card .nm { font-family: var(--display); font-size: 15px; line-height: 1.05; }
.card .rr { font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--c); text-transform: uppercase; }
.card .art { background: radial-gradient(ellipse at 50% 110%, #3a2a6b, #151129 70%); border-radius: 10px; aspect-ratio: 4 / 3; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.card .art svg { height: 94%; width: auto; }
.card .ty { align-self: flex-start; font-size: 10px; font-weight: 800; padding: 1px 8px; border-radius: 99px; color: var(--bg); }
.card .st { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; }
.card .st b { font-family: var(--display); font-weight: 400; }
.card .wpn { font-size: 12px; font-weight: 800; background: #ffffff12; border-radius: 8px; padding: 5px 8px; margin: 4px 0; }
.card .wpn b { color: #ffe9a8; font-family: var(--display); font-weight: 400; }
.card .wpn small { display: block; font-size: 10px; color: var(--dim); font-weight: 700; }
.gmp { width: min(900px, 94vw); background: #ffffff10; border: 2px solid #ff8a3c; border-radius: 12px; padding: 8px 12px; margin: 6px 0; }
.gmp b { font-family: var(--display); font-weight: 400; color: #ffb070; }
.card .wpn.none b { color: var(--dim); }
.card .st { flex-wrap: wrap; gap: 2px 8px; }
.card .st span { white-space: nowrap; }
.card .sp { background: #ffffff0d; border-radius: 8px; padding: 5px 7px; font-size: 11px; font-weight: 600; }
.card .sp b { display: block; font-family: var(--display); font-weight: 400; color: var(--legend); font-size: 11px; }
.card.big { width: min(240px, 70vw); }
.card.big .nm { font-size: 20px; }
.pick { cursor: pointer; border-radius: 14px; background: none; border: 0; padding: 0; position: relative; }
.pick .card { height: 100%; }
.pick:hover .card { transform: translateY(-3px); }
.pick .badge { position: absolute; top: -8px; right: -6px; z-index: 2; font-family: var(--display); background: var(--legend); color: #2a1a00; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #a06a00; }
.pick.off { opacity: .5; }
.topbar { position: sticky; top: 0; z-index: 4; align-self: stretch; display: flex; justify-content: center; padding: 6px 0; background: #0d0a18ee; }
.pv { max-width: 760px; grid-template-columns: repeat(auto-fit, minmax(152px, 200px)); justify-content: center; }
.pvnotes { display: flex; flex-direction: column; gap: 4px; font-weight: 800; font-size: 14px; max-width: 620px; }
.sec { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.sec[hidden], .shopitem[hidden], .pick[hidden], #nores[hidden], #pnores[hidden] { display: none; }
.wsearch { width: min(440px, 92vw); padding: 10px 14px; border-radius: 12px; border: 3px solid #3a3160; background: var(--panel); color: var(--fg); font: 700 16px var(--body); }
.bfilter { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; font-weight: 800; font-size: 13px; color: var(--dim); }
.bfilter select { background: var(--panel); color: var(--fg); border: 2px solid #3a3160; border-radius: 8px; padding: 6px 8px; font: 700 14px var(--body); }
.bfilter select:focus-visible { outline: 3px solid var(--legend); outline-offset: 2px; }
.btn.tiny { padding: 5px 12px; font-size: 12px; box-shadow: 0 3px 0 #120f1f; }
.wsearch:focus-visible { outline: 3px solid var(--legend); outline-offset: 2px; }
.tys { display: flex; gap: 5px; flex-wrap: wrap; }
.door.quest { gap: 4px; }
.door .qi { font-size: 34px; line-height: 1; }
.door .qk { font-family: var(--display); font-size: 11px; letter-spacing: .08em; color: var(--dc); }
.door .qr { color: var(--legend); }
.memgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(420px, 90vw); }
.mem { aspect-ratio: 1; border-radius: 18px; border: 4px solid var(--mc); background: color-mix(in srgb, var(--mc) 22%, #1d1833); color: var(--fg); font-family: var(--display); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform .08s, filter .08s; }
.mem span { font-size: 36px; line-height: 1; }
.mem small { font-size: 12px; color: var(--mc); }
.mem.lit { filter: brightness(1.8); transform: scale(1.08); box-shadow: 0 0 28px var(--mc); }
.mem:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

/* mystery disk opening */
.disk-stage { position: relative; width: 260px; height: 330px; display: flex; align-items: center; justify-content: center; }
.disk { position: absolute; width: 150px; height: 150px; animation: diskIn 1.1s cubic-bezier(.3,1.4,.5,1) both; }
.disk .half { position: absolute; left: 0; width: 150px; height: 75px; overflow: hidden; }
.disk .half::before { content: ""; position: absolute; left: 0; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #151129 0 12%, #c9ced8 13% 18%, var(--rc) 19% 62%, #ffffff 63% 66%, var(--rc) 67%); box-shadow: inset 0 0 0 5px #0006; }
.disk .top { top: 0; } .disk .top::before { top: 0; }
.disk .bot { top: 75px; } .disk .bot::before { top: -75px; }
.disk.open .top { animation: splitUp .5s ease-out forwards; }
.disk.open .bot { animation: splitDown .5s ease-out forwards; }
@keyframes diskIn { 0% { transform: translateY(-260px) rotate(-540deg) scale(.4); } 100% { transform: none; } }
@keyframes splitUp { to { transform: translateY(-120px) rotate(-25deg); opacity: 0; } }
@keyframes splitDown { to { transform: translateY(120px) rotate(25deg); opacity: 0; } }
.disk.wobble { animation: wobble .5s ease-in-out infinite; }
@keyframes wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.05); } }
.reveal { animation: cardOut .6s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes cardOut { from { transform: scale(.1) rotate(-20deg); opacity: 0; } }
.burst { position: absolute; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, var(--rc) 0%, transparent 65%); opacity: .55; animation: pulse 1.4s ease-in-out infinite; pointer-events: none; }
@keyframes pulse { 50% { transform: scale(1.12); opacity: .8; } }
.bank { font-weight: 800; color: var(--dim); font-size: 15px; display: flex; align-items: center; gap: 6px; }
.bank b { font-family: var(--display); font-weight: 400; color: var(--legend); font-size: 22px; }
.coinchip { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4b0, var(--legend) 45%, #b47b00); }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; width: 100%; max-width: 900px; }
.door { --dc: var(--heart); cursor: pointer; border: 4px solid var(--dc); border-radius: 16px; background: linear-gradient(180deg, #2a2348, var(--panel)); color: var(--fg); padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--body); box-shadow: 0 5px 0 #0008; }
.door:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #0008, 0 0 20px var(--dc); }
.door:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.door b { font-family: var(--display); font-weight: 400; font-size: clamp(14px, 2vw, 20px); color: var(--dc); }
.door span { font-size: 12px; font-weight: 700; color: var(--dim); }
.arena-door { background: linear-gradient(180deg, #5a1424, #2a0c14); }
.arena-door b { color: #fff; font-size: clamp(16px, 2.4vw, 24px); }
.mini-disk { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle, #151129 0 12%, #c9ced8 13% 18%, var(--dc) 19% 62%, #fff 63% 66%, var(--dc) 67%); animation: spinDisk 3s linear infinite; }
@keyframes spinDisk { to { transform: rotate(360deg); } }
.note { color: var(--heart); min-height: 1.4em; }
.shelf { font-size: clamp(14px, 2.2vw, 22px); }
.shopitem { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.shopitem .card { flex: 1; }
.shopitem .btn { padding: 7px 10px; font-size: 13px; }
.toast { font-family: var(--display); font-size: clamp(16px, 3vw, 28px); }

.keys { position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); z-index: 5; padding: 6px 16px; background: #0d0a18cc; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 18px; justify-content: center; color: var(--dim); font-size: 13px; font-weight: 700; }
.keys b { color: var(--fg); font-family: var(--display); font-weight: 400; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }

/* shiny cards: art glows in the warrior's element colour, rarer cards have a moving sheen */
.card { --ec: #7a6aa8; }
.card .art { background: radial-gradient(ellipse at 50% 110%, color-mix(in srgb, var(--ec) 50%, #3a2a6b), #151129 72%); }
.card .bst { background: color-mix(in srgb, var(--bc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--bc) 55%, transparent); border-radius: 8px; padding: 4px 7px; font-size: 11px; font-weight: 800; }
.card .bst b { font-family: var(--display); font-weight: 400; color: var(--bc); }
.card .bst small { display: block; font-weight: 600; color: var(--dim); font-size: 10px; }
.card.epic::after, .card.legendary::after, .card.special::after, .card.giant::after { content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none; background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.24) 50%, transparent 62%); background-size: 280% 100%; animation: sheen 3.4s ease-in-out infinite; }
@keyframes sheen { 0% { background-position: 140% 0; } 55%, 100% { background-position: -40% 0; } }
#ov.lite { background: #0d0a1833; }
#ov.lite h1 { animation: floaty 3s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-8px); } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

.advtoast { position: fixed; top: 10px; left: 50%; transform: translate(-50%, -170%); z-index: 40; background: linear-gradient(180deg, #2a2348, #1d1833); border: 3px solid var(--legend); border-radius: 16px; padding: 10px 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 0 30px #ffc93c66, 0 6px 0 #0008; transition: transform .5s cubic-bezier(.3,1.4,.5,1); pointer-events: none; max-width: min(92vw, 560px); text-align: left; }
.advtoast.show { transform: translate(-50%, 0); }
.advtoast .ai { font-size: 40px; line-height: 1; }
.advtoast small { display: block; font-family: var(--display); font-size: 11px; letter-spacing: .1em; color: var(--legend); }
.advtoast b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.advtoast .r { display: block; font-size: 13px; font-weight: 800; color: #ffe9a8; }
.advgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; width: 100%; max-width: 1000px; }
.adv { display: flex; gap: 10px; text-align: left; background: linear-gradient(180deg, #2a2348, var(--panel)); border: 3px solid #3a3160; border-radius: 14px; padding: 10px; }
.adv.got { border-color: #9be22d; box-shadow: 0 0 16px #9be22d44; }
.adv:not(.got) { opacity: .75; }
.adv .ai { font-size: 34px; line-height: 1; }
.adv b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.adv p { margin: 3px 0 6px; font-size: 13px; font-weight: 700; color: var(--dim); }
.adv small { font-size: 11px; font-weight: 800; color: var(--dim); }
.rw { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 99px; margin: 0 4px 4px 0; background: var(--legend); color: #2a1a00; }
.rw.w { background: var(--special); color: #2a0020; }
.rw.f { background: #4a4170; color: #fff; }
.adp { height: 8px; background: #ffffff1a; border-radius: 4px; overflow: hidden; }
.adp i { display: block; height: 100%; background: #9be22d; }
.adbar { width: min(420px, 90vw); height: 12px; background: #ffffff1a; border-radius: 6px; overflow: hidden; }
.adbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffc93c, #9be22d); }
</style>

<div id="stage">
  <canvas id="cv" width="960" height="540" tabindex="0" aria-label="Toybox Brawl game screen"></canvas>
  <div id="ov"></div>
</div>
<canvas id="fx"></canvas>
<div id="adv" class="advtoast" aria-live="polite"></div>

<script>
// ===================== WARRIORS =====================
// Kid's rules: Health max 10, Damage max 8, Health + Damage max 13 (Legendary warriors up to 17), starters max 9.
// Giants are the exception: Health up to 17. They wear armour (armor: N) that has to be smashed off each round before the fight bar can be hurt.
// fx = what the special does in a fight. kind "buff" helps yourself; everything else is an attack.
const WARRIORS = [
  { id: "boulder", name: "Boulderbash", type: "Smasher", rarity: "common", element: "earth", starter: true, hp: 6, dmg: 3, special: "GROUND QUAKE", does: "Shockwave along the floor. Stuns for 2 seconds.", fx: { range: 170, stun: 2 } },
  { id: "volt", name: "Volt Vixen", type: "Speedster", rarity: "common", element: "lightning", starter: true, hp: 7, dmg: 2, special: "LIGHTNING DASH", does: "Zooms in. Can't be blocked.", fx: { unblock: 1, dash: 1 }, boosts: [{ stat: "dmg", amt: 3, vs: "earth" }, { stat: "spd", amt: 3, vs: "water" }] },
  { id: "brick", name: "Brickjaw", type: "Brawler", rarity: "common", element: "earth", starter: true, hp: 5, dmg: 4, special: "CHOMP COMBO", does: "Double Damage.", fx: { mult: 2 } },
  { id: "gus", name: "Gearhead Gus", type: "Brawler", rarity: "common", element: "lightning", hp: 7, dmg: 3, special: "WRENCH THROW", does: "Throws a wrench from a distance. 1 extra Damage.", fx: { range: 300, extra: 1 } },
  { id: "spark", name: "Sparkplug", type: "Speedster", rarity: "common", element: "lightning", hp: 6, dmg: 4, special: "ROLL OUT", does: "Dodges the next hit.", fx: { kind: "buff", dodge: 1 } },
  { id: "clam", name: "Clamshell Carl", type: "Brawler", rarity: "common", element: "water", hp: 8, dmg: 3, special: "CLAM SNAP", does: "Snaps shut on the enemy. Stuns for 1 second. 1 extra Damage.", fx: { stun: 1, extra: 1 } },
  { id: "pebble", name: "Pebblepop", type: "Smasher", rarity: "common", element: "earth", hp: 7, dmg: 3, special: "PEBBLE TOSS", does: "Hits from across the arena.", fx: { range: 520 } },
  { id: "rust", name: "Rustbucket", type: "Brawler", rarity: "common", element: "earth", hp: 6, dmg: 4, special: "JUNK TOSS", does: "Hurls scrap from a distance. 1 extra Damage.", fx: { range: 300, extra: 1 } },
  { id: "gecko", name: "Gecko Go", type: "Speedster", rarity: "common", element: "lightning", hp: 6, dmg: 4, special: "WALL RUN", does: "Lands behind the enemy. Can't be blocked.", fx: { teleport: 1, unblock: 1 } },
  { id: "bubble", name: "Bubblebolt", type: "Speedster", rarity: "common", element: "water", hp: 7, dmg: 3, special: "PUFF UP", does: "Next time he's defeated, he only loses 1 Health.", fx: { kind: "buff", half: 1 } },
  { id: "mud", name: "Mudslug", type: "Smasher", rarity: "common", element: "earth", hp: 8, dmg: 3, special: "SLIME SLIDE", does: "The enemy slips. Stunned 2 seconds.", fx: { stun: 2 } },
  { id: "coil", name: "Coppercoil", type: "Brawler", rarity: "common", element: "lightning", hp: 6, dmg: 5, special: "BOING BASH", does: "2 extra Damage.", fx: { extra: 2 } },
  { id: "thorn", name: "Thornbeak", type: "Speedster", rarity: "common", element: "light", hp: 6, dmg: 5, special: "DIVE BOMB", does: "Swoops in. Can't be blocked.", fx: { unblock: 1, dash: 1 } },
  { id: "cub", name: "Cobblecub", type: "Brawler", rarity: "common", element: "earth", hp: 7, dmg: 4, special: "BEAR HUG", does: "Holds the enemy for 2 seconds.", fx: { stun: 2 } },
  { id: "frost", name: "Frostfang", type: "Speedster", rarity: "rare", element: "water", hp: 7, dmg: 5, special: "FREEZE BITE", does: "Freezes the enemy for 3 seconds.", fx: { stun: 3 } },
  { id: "ink", name: "Inkspike", type: "Speedster", rarity: "rare", element: "shadow", hp: 6, dmg: 6, special: "INK CLOUD", does: "The enemy can't see for 3 seconds.", fx: { blind: 3 } },
  { id: "hex", name: "Hexwing", type: "Speedster", rarity: "rare", element: "shadow", hp: 5, dmg: 7, special: "DAZZLE", does: "Flips the enemy's controls for 3 seconds.", fx: { reverse: 3 } },
  { id: "grizz", name: "Grizzlock", type: "Brawler", rarity: "rare", element: "shadow", hp: 7, dmg: 5, special: "LOCKDOWN", does: "Enemy can't use their special for 10 seconds.", fx: { lock: 10 } },
  { id: "glacier", name: "Glacierback", type: "Smasher", rarity: "rare", element: "water", hp: 8, dmg: 4, special: "AVALANCHE", does: "Long reach. Stuns for 2 seconds.", fx: { range: 210, stun: 2 } },
  { id: "ray", name: "Riptide Ray", type: "Speedster", rarity: "rare", element: "water", hp: 6, dmg: 6, special: "SHOCK WAVE", does: "Zaps for 2 Damage from far away. Can't be blocked.", fx: { range: 520, unblock: 1, fixed: 2 } },
  { id: "smoke", name: "Smokestack", type: "Brawler", rarity: "rare", element: "fire", hp: 7, dmg: 5, special: "FULL STEAM", does: "Charges in for 3 extra Damage.", fx: { extra: 3, dash: 1 } },
  { id: "vine", name: "Venomvine", type: "Speedster", rarity: "rare", element: "shadow", hp: 5, dmg: 7, special: "POISON BITE", does: "Enemy loses 1 Health at the start of the next 3 rounds.", fx: { poison: 3 } },
  { id: "scrap", name: "Scrapjaw", type: "Brawler", rarity: "rare", element: "fire", hp: 7, dmg: 5, special: "FEEDING FRENZY", does: "Hits extra hard now and on his next 2 hits.", fx: { extra: 1, frenzy: 2 } },

const BY_ID = Object.fromEntries(WARRIORS.map(w => [w.id, w]));
// Mega Breakers have two elements (element and element2): they get both perks and both sets of boosts work against them.
const hasEl = (w, e) => w.element === e || w.element2 === e;
const elsOf = w => w.element2 ? [w.element, w.element2] : [w.element];
const elPick = w => w.element2 && Math.random() < 0.5 ? w.element2 : w.element;
const elName = w => elsOf(w).map(e => ELEMENTS[e].name).join(" + ");

// ===================== GIANT MODE =====================
// Boulderbash, Volt Vixen and Brickjaw can grow into a giant (more Health and Damage, plus armour to smash off first).
// Unlock: win 15 Arena battles with them on your team. Then switch it on or off in the Team bench.
const GM_WINS = 15;
const COIN_RATE = 0.5, cr = n => Math.max(1, Math.round(n * COIN_RATE));   // all coin rewards are halved so the game lasts longer
const GIANT_FORMS = { boulder: { hp: 13, dmg: 5, armor: 40 }, volt: { hp: 11, dmg: 4, armor: 30 }, brick: { hp: 12, dmg: 6, armor: 40 } };
const gmWins = id => (save && save.stats && save.stats.teamWins && save.stats.teamWins[id]) || 0;
const gmUnlocked = id => !!GIANT_FORMS[id] && gmWins(id) >= GM_WINS;
const gmOn = id => gmUnlocked(id) && !!(save.giantMode && save.giantMode[id]);
const isG = id => !!BY_ID[id].giant || gmOn(id);
const GM_CACHE = {};
function effW(id) {   // the warrior as it fights: its giant form if Giant Mode is on
  const w = BY_ID[id]; if (!gmOn(id)) return w;
  const f = GIANT_FORMS[id]; if (GM_CACHE[id]) return GM_CACHE[id];
  const fx = { ...w.fx }; if (fx.kind !== "buff") fx.extra = (fx.extra || 0) + 1;
  return GM_CACHE[id] = { ...w, name: "Giant " + w.name, giant: "form", hp: f.hp, dmg: f.dmg, armor: f.armor, fx };
}
const gmHTML = w => !GIANT_FORMS[w.id] || !save ? "" : gmUnlocked(w.id) ? `<div class="wpn"><b>\u{1F5FF} GIANT MODE</b> unlocked<small>Switch it on in the Team bench.</small></div>` : `<div class="wpn none"><b>\u{1F5FF} GIANT MODE</b> ${gmWins(w.id)} / ${GM_WINS}<small>Win ${GM_WINS} Arena battles with this warrior on your team.</small></div>`;
function gmPanel() {   // shown at the top of the Team bench
  const mine = Object.keys(GIANT_FORMS).filter(id => save.owned.includes(id)); if (!mine.length) return "";
  return `<div class="gmp"><b>\u{1F5FF} Giant Mode</b><div class="row">${mine.map(id => { const w = BY_ID[id], f = GIANT_FORMS[id];
    return gmUnlocked(id) ? `<button class="btn ${gmOn(id) ? "" : "alt"} tiny" data-gm="${id}">${w.name}: ${gmOn(id) ? "ON" : "OFF"} (${f.hp} Health, ${f.dmg} Damage, ${f.armor} armour)</button>` : `<span class="rw f">${w.name}: ${gmWins(id)} / ${GM_WINS} wins</span>`; }).join("")}</div></div>`;
}

// ===================== RANKS =====================
// Your rank goes up with Arena wins. To buy a warrior (or pull one from a disk) you need its rarity as your rank, or higher.
const RANKS = ["common", "rare", "epic", "legendary"], RANK_WINS = [0, 8, 24, 50];
const rankName = i => RANKS[i][0].toUpperCase() + RANKS[i].slice(1);
function rankIdx() { let r = 0; RANK_WINS.forEach((n, i) => { if ((save.wins || 0) >= n) r = i; }); return r; }
const rankOK = w => RANKS.indexOf(w.rarity) <= rankIdx();
function rankLine() { const r = rankIdx(), nxt = RANK_WINS[r + 1]; return `Rank: <b style="color:${RARITY_COLOR[RANKS[r]]}">${rankName(r).toUpperCase()}</b>${nxt !== undefined ? ` (${nxt - save.wins} more win${nxt - save.wins === 1 ? "" : "s"} for ${rankName(r + 1)})` : " (top rank!)"}`; }
const SPEED_NUM = { Smasher: 3, Brawler: 5, Speedster: 8 };   // shown on cards: how fast a type really walks (Smashers slow, Speedsters fast)
const TYPE_COLOR = { Smasher: "#ff6a3d", Speedster: "#2fd3ff", Brawler: "#9be22d" };
const RARITY_COLOR = { common: "#d8d4ea", rare: "#4d8dff", epic: "#b45cff", legendary: "#ffc93c", special: "#ff5ad8", giant: "#ff8a3c" };

// ===================== FIGURE BUILDER =====================
// Every warrior is built from parts (head, body, arms, legs, tail, back) so each one has its own shape,
// not just its own colours. FIGS holds the colours, DESIGN holds which parts each warrior is made of.
const OUT = 'stroke="#0005" stroke-width="2" stroke-linejoin="round"';
const rect = (x, y, w, h, r, fill, o = OUT) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" ${o}/>`;
const ell = (x, y, rx, ry, fill, o = OUT) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" ${o}/>`;
const circ = (x, y, r, fill, o = OUT) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${o}/>`;
const poly = (pts, fill, o = OUT) => `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="${fill}" ${o}/>`;
const pth = (d, fill, o = OUT) => `<path d="${d}" fill="${fill}" ${o}/>`;
const line = (d, c, w = 3) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const NO = "";
const mirror = (fn, cx) => fn(-1) + fn(1);
const eyes2 = (P, y, gap = 8, r = 5) => [-1, 1].map(s => circ(P.cx + s * gap, y, r, "#fff", NO) + circ(P.cx + s * gap, y + 1, r * 0.5, P.f.eye, NO)).join("");

// ----- heads (centred on cx, covering about y 2 to 52) -----
function canine(P, kind) {
  const { f, cx } = P, floppy = kind === "dog", big = kind === "fox", ear = big ? -2 : 2;
  let s = "";
  if (floppy) s += ell(cx - 21, 30, 8, 15, f.dark) + ell(cx + 21, 30, 8, 15, f.dark);
  else s += [-1, 1].map(d => poly([[cx + d * 20, 24], [cx + d * 13, ear], [cx + d * 5, 20]], f.body) + poly([[cx + d * 16, 22], [cx + d * 13, ear + 6], [cx + d * 9, 21]], f.armor, NO)).join("");
  s += poly([[cx - 19, 20], [cx + 19, 20], [cx + 16, 36], [cx, big ? 50 : 54], [cx - 16, 36]], f.body);
  s += [-1, 1].map(d => poly([[cx + d * 18, 32], [cx + d * 3, 46], [cx + d * 15, 42]], f.armor, NO)).join("");
  s += [-1, 1].map(d => poly([[cx + d * 14, 27], [cx + d * 5, 29], [cx + d * 6, 33], [cx + d * 14, 31]], f.eye, NO)).join("");
  s += ell(cx, big ? 48 : 51, 4.5, 3.2, f.dark, NO);
  return s;
}
const HEAD = {
  box: P => rect(P.cx - 20, 16, 40, 34, 10, P.f.body) + rect(P.cx - 15, 24, 30, 10, 4, P.f.dark, NO) + rect(P.cx - 11, 27, 8, 4, 2, P.f.eye, NO) + rect(P.cx + 3, 27, 8, 4, 2, P.f.eye, NO),

  bird: P => { const { f, cx } = P; return [-1, 0, 1].map(d => poly([[cx + d * 7 - 3, 18], [cx + d * 9, 3], [cx + d * 7 + 3, 18]], f.armor)).join("") + ell(cx, 33, 19, 18, f.body) + poly([[cx - 6, 34], [cx + 6, 34], [cx, 50]], "#ffb13c") + eyes2(P, 28, 10, 5); },

  dragon: P => { const { f, cx } = P; return [-1, 1].map(d => pth(`M${cx + d * 12} 20 q${d * 14} -4 ${d * 14} -18 q${d * -10} 6 ${d * -18} 12z`, f.armor)).join("") + poly([[cx - 20, 20], [cx + 20, 20], [cx + 16, 38], [cx + 10, 52], [cx - 10, 52], [cx - 16, 38]], f.body) + [-1, 1].map(d => poly([[cx + d * 16, 24], [cx + d * 6, 28], [cx + d * 7, 32], [cx + d * 16, 30]], f.eye, NO) + circ(cx + d * 4, 47, 1.8, f.dark, NO)).join("") + line(`M${cx - 8} 51 l2 4 l2 -4 l2 4 l2 -4 l2 4 l2 -4 l2 4`, "#fff", 1.6); },
  frog: P => { const { f, cx } = P; return ell(cx, 38, 24, 13, f.body) + [-1, 1].map(d => circ(cx + d * 13, 24, 8, f.body) + circ(cx + d * 13, 24, 5, "#fff", NO) + circ(cx + d * 13, 25, 2.6, f.eye, NO)).join("") + line(`M${cx - 15} 42 q15 8 30 0`, f.dark, 2); },

// Every warrior gets a chest emblem for its element, and rarer ones get extra shiny trim.
function emblem(el, cx, c, y = 75) {
  if (el === "fire") return `<path d="M${cx} ${y-8} q-7 7 -4 12 q2 4 4 4 q2 0 4 -4 q3 -5 -4 -12z" fill="${c}"/>`;

function buyDisk(kind) {

function buy(w) {

// The moving picture behind the menus: a drifting checker floor, floating element sparks and a parade of warriors.
let BG_CAST = null, BG_BITS = null;
function drawBackdrop() {
  if (!BG_CAST) {
    const pool = WARRIORS.filter(w => !w.quest), els = Object.keys(ELEMENTS);
    BG_CAST = Array.from({ length: 9 }, (_, i) => ({ id: pool[Math.floor(Math.random() * pool.length)].id, off: i * 170, bob: Math.random() * 6 }));
    BG_BITS = Array.from({ length: 40 }, () => ({ x: Math.random() * 1600, y: Math.random() * H, v: 0.25 + Math.random() * 0.7, c: ELEMENTS[els[Math.floor(Math.random() * 6)]].color, s: 2 + Math.random() * 4 }));
  }
  const t = frame;
  ctx.fillStyle = "#17122a"; ctx.fillRect(0, 0, W, H);
  const ox = (t * 0.35) % 96, oy = (t * 0.2) % 96;
  for (let iy = -2; iy * 48 - oy < H; iy++) for (let ix = -2; ix * 48 - ox < W; ix++) { ctx.fillStyle = (ix + iy) & 1 ? "#1f1838" : "#262046"; ctx.fillRect(ix * 48 - ox, iy * 48 - oy, 48, 48); }
  for (const b of BG_BITS) {
    b.y -= b.v; if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; }
    ctx.globalAlpha = 0.5; ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x % W, b.y, b.s, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const c of BG_CAST) {
    const x = ((c.off + t * 0.7) % (W + 240)) - 120, y = H - 44 + Math.sin(t / 14 + c.bob) * 6;
    ctx.fillStyle = "#0006"; ctx.beginPath(); ctx.ellipse(x, y + 3, 34, 8, 0, 0, 7); ctx.fill();
    drawFig(ctx, c.id, x, y, 96, 1, 0.95, { squash: 1 + 0.03 * Math.sin(t / 6 + c.bob), tilt: Math.sin(t / 7 + c.bob) * 0.05 });
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.62); v.addColorStop(0, "#0000"); v.addColorStop(1, "#000a");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// Odds out of 100: Common 50, Rare 32, Epic 14, Legendary 4. Duplicates give nothing (kid's rule).
function rollRarity(odds) {
  let r = Math.random() * 100;
  for (const k of ["giant", "legendary", "epic", "rare", "common"]) { r -= odds[k] || 0; if (r < 0) return k; }
  return Object.keys(odds)[0];
}
function openDisk(kind = "basic") {
  const d = DISKS[kind];
  let rarity = rollRarity(d.odds);
  if (rarity !== "giant" && RANKS.indexOf(rarity) > rankIdx()) rarity = RANKS[rankIdx()];   // disks only give warriors up to your rank
  const pool = WARRIORS.filter(w => w.rarity === rarity);
  const w = pool[Math.floor(Math.random() * pool.length)];
  const dupe = save.owned.includes(w.id);
  bump("disks"); bump("spent", d.price);
  if (rarity === "legendary" && kind !== "giant") award("luckyday");
  if (dupe) award("deja");
  if (!dupe) { save.owned.push(w.id); if (!teamRule(save.team, w.id)) save.team.push(w.id); persist(); }
  overlay(`<div class="disk-stage" style="--rc:#8a84a8"><div class="disk" id="disk"><div class="half top"></div><div class="half bot"></div></div></div><p class="sub" id="dmsg">The disk is spinning...</p>`);
  const stage = ov.querySelector(".disk-stage"), disk = document.getElementById("disk");
  Sound.spin();
  setTimeout(() => { if (!disk.isConnected) return; Sound.rattle(); disk.classList.add("wobble"); stage.style.setProperty("--rc", RARITY_COLOR[rarity]); document.getElementById("dmsg").textContent = "Something's inside..."; }, 1100);
  setTimeout(() => {
    if (!disk.isConnected) return;
    dupe ? Sound.dupe() : Sound.reveal(rarity);
    if (!dupe && rarity !== "common") confetti([RARITY_COLOR[rarity], "#ffffff", "#ffc93c"], rarity === "legendary" ? 220 : 120);
    disk.classList.remove("wobble"); disk.classList.add("open");
    stage.insertAdjacentHTML("beforeend", `<div class="burst"></div>${cardHTML(w, "big reveal")}`);
    const m = document.getElementById("dmsg");
    m.outerHTML = `<div class="toast" style="color:${dupe ? "#ff4d6a" : RARITY_COLOR[rarity]}">${dupe ? "Already got it. Too bad!" : `NEW ${rarity.toUpperCase()} WARRIOR!`}</div>
      <div class="row"><button class="btn" id="ok">Back to the disk stall</button>${save.coins >= d.price ? `<button class="btn alt" id="again">Open another (${d.price})</button>` : ""}</div>`;
    document.getElementById("ok").onclick = () => diskStall();
    const a = document.getElementById("again");
    if (a) a.onclick = () => { save.coins -= d.price; persist(); openDisk(kind); };
    document.getElementById("ok").focus();
  }, 2300);
}

// Team rules: up to 3 warriors, but only 1 giant per team, and a team with a giant only has room for 1 other warrior.
function teamRule(team, id) {   // returns why this warrior can't join the team, or "" if they can
  const giants = team.filter(isG).length;
  if (isG(id)) {
    if (giants >= 1) return "Only 1 giant per team.";
    if (team.length >= 2) return "A giant only teams up with 1 other warrior. Take someone off first.";
  } else if (giants && team.length >= 2) return "A team with a giant only has room for 1 other warrior.";
  else if (team.length >= 3) return "Teams have up to 3 warriors.";

}

// Before any arena, giant or quest fight: shows who you are facing and which boosts match, then lets you change your team.
function matchupLines(mine, foes) {
  const out = [], line = (who, w, b, foe) => b.stat === "dmg" ? `${w.name} does +${b.amt} Damage to ${foe.name} (${elName(foe)})` : b.stat === "spd" ? `${w.name} walks +${b.amt} faster against ${foe.name} (${elName(foe)})` : `${w.name} takes ${b.amt} less Damage from ${foe.name} (${elName(foe)})`;
  for (const id of mine) for (const fid of foes) {
    const a = BY_ID[id], f = BY_ID[fid];
    for (const b of boostsOf(id)) if (hasEl(f, b.vs)) out.push([true, line(a, a, b, f)]);
    for (const b of boostsOf(fid)) if (hasEl(a, b.vs)) out.push([false, line(f, f, b, a)]);
  }
  return out;
}
function previewFight(enemyIds, opts, back) {

// ===================== FIGHT =====================
// Top-down arena (seen from above at a slight angle): both warriors can walk anywhere on the floor and
// every attack auto-aims at the enemy. Real-time rounds: each round both warriors start with a full fight
// bar and hits knock it down. Empty fight bar = defeated, and ONLY THEN the winner's Damage comes off the
// loser's Health. At 0 Health the next teammate switches in. Specials charge on hitting and getting hit,
// and once the special bar is full, ANY punch or kick fires the special instead.
// Elements: every warrior has one, and each has a small perk (see ELEMENTS). There is no element wheel any more.
const ROUND_BAR = 100;
const HIT_POWER = { punch: 20, kick: 30, special: 45 };
const TYPE_POWER = { Smasher: 1.3, Brawler: 1.0, Speedster: 0.8 };
const MOVES = { punch: { s: 6, a: 4, r: 10, range: 90 }, kick: { s: 11, a: 5, r: 16, range: 115 }, special: { s: 12, a: 8, r: 18, range: 125 } };

// Feet can stand anywhere between the back edge (AY0) and the front edge (AY1) of the floor.

const AY0 = 275, AY1 = 480;
const depthScale = y => 0.82 + 0.28 * (y - AY0) / (AY1 - AY0);

  }

    if (p.el === "fire") { p.vy -= 0.07; p.vx *= 0.97; }

    ctx.font = "800 13px Nunito, sans-serif"; ctx.globalAlpha = pulse; ctx.fillStyle = BOOST_COL[ab.stat];
    ctx.fillText(`\u25B2 BOOST ON: +${ab.amt} ${BOOST_NAME[ab.stat]} vs ${e.name.toUpperCase()}`, tx, 99); ctx.globalAlpha = 1;
  }
  // this round's fight bar (blue): hits knock it down, empty = defeated
  const cw = 230, cx = left ? x0 + 14 : x0 + 366 - cw;
  const act = F.actors && F.actors[p], bar = act ? Math.max(0, act.bar) / act.max : 1;
  ctx.fillStyle = "#ffffff1a"; roundRect(cx, 106, cw, 12, 6); ctx.fill();
  if (bar > 0) { ctx.fillStyle = bar < 0.3 ? "#ff8a3d" : "#2fd3ff"; roundRect(left ? cx : cx + cw - cw * bar, 106, cw * bar, 12, 6); ctx.fill(); }
  if (act && act.armorMax && act.armor > 0) {
    const ak = act.armor / act.armorMax;
    const ax0 = left ? cx : cx + cw - cw * ak, gg = ctx.createLinearGradient(0, 106, 0, 118);
    gg.addColorStop(0, "#f2f5fc"); gg.addColorStop(0.5, "#aab7d0"); gg.addColorStop(1, "#6a7894");
    ctx.fillStyle = gg; roundRect(ax0, 106, cw * ak, 12, 6); ctx.fill(); ctx.strokeStyle = "#232c47"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = "#232c4799"; ctx.lineWidth = 1.5;   // marks where the shoulder plates (66%) and chest plate (33%) come off
    for (const mk of [0.33, 0.66]) { const mx = left ? cx + cw * mk : cx + cw - cw * mk; if (mx > ax0 + 4 && mx < ax0 + cw * ak - 4) { ctx.beginPath(); ctx.moveTo(mx, 107); ctx.lineTo(mx, 117); ctx.stroke(); } }
    ctx.fillStyle = "#2a3350"; ctx.font = "800 10px Nunito, sans-serif"; ctx.fillText("ARMOUR", left ? cx + 6 : cx + cw - 6, 116);
  }
  // special charge (yellow)
  ctx.fillStyle = "#ffffff1a"; roundRect(cx, 124, cw, 8, 4); ctx.fill();
  const full = f.charge >= 100;
  ctx.fillStyle = full ? (F.t % 20 < 10 ? "#ffc93c" : "#fff36b") : "#ffc93c"; roundRect(left ? cx : cx + cw - cw * f.charge / 100, 124, cw * f.charge / 100, 8, 4); ctx.fill();
  ctx.font = "800 11px Nunito, sans-serif"; ctx.fillStyle = full ? "#ffc93c" : "#a59fc4";
  ctx.fillText(act && act.armor > 0 ? "BREAK THE ARMOUR FIRST!" : F.opts.nospecial ? "NO SPECIALS IN THIS FIGHT" : full ? "SPECIAL READY - ANY ATTACK FIRES IT!" : f.w.special, left ? cx : cx + cw, 146);
  // team dots
  team.forEach((t, i) => {
    const dx = left ? x0 + 290 + i * 28 : x0 + 90 - i * 28;
    ctx.globalAlpha = t.hp > 0 ? 1 : 0.25; drawFig(ctx, t.w.id, dx, 144, 22); ctx.globalAlpha = 1;
  });
}

// ----- element memory (copy the pattern, like a music game) -----
let memRun = 0;
function memoryGame() {
  const keys = Object.keys(ELEMENTS), GOAL = 5, NOTE = { fire: 262, water: 330, earth: 392, lightning: 523, light: 659, shadow: 196 };
  const run = ++memRun, rnd = () => keys[Math.floor(Math.random() * keys.length)];
  let seq = [rnd()], pos = 0, ok = false;
  overlay(`<h2>🔮 Element Memory</h2><p class="sub" id="mm">Watch carefully...</p>
    <div class="memgrid">${keys.map(k => `<button class="mem" data-k="${k}" style="--mc:${ELEMENTS[k].color}"><span>${ELEMENTS[k].icon}</span><small>${ELEMENTS[k].name}</small></button>`).join("")}</div>
    <p class="sub">Pattern length: <b id="mr">1</b> of ${GOAL}</p><button class="btn alt" id="back">Back to quests</button>`);
  const live = () => run === memRun && document.getElementById("mm");
  const say = t => { const e = live(); if (e) e.textContent = t; };
  const btn = k => ov.querySelector(`.mem[data-k="${k}"]`);
  const flash = k => { const b = btn(k); if (!b) return; b.classList.add("lit"); Sound.note(NOTE[k]); setTimeout(() => b.classList.remove("lit"), 380); };
  const play = () => {
    ok = false; pos = 0; say("Watch carefully...");
    seq.forEach((k, i) => setTimeout(() => { if (live()) flash(k); }, 700 + i * 700));
    setTimeout(() => { if (live()) { ok = true; say("Your turn!"); } }, 700 + seq.length * 700);
  };
  ov.querySelectorAll(".mem").forEach(b => b.onclick = () => {
    if (!ok) return;
    const k = b.dataset.k; flash(k);
    if (k !== seq[pos]) { ok = false; Sound.buzz(); say("Oops! Let's start again."); seq = [rnd()]; document.getElementById("mr").textContent = 1; setTimeout(() => live() && play(), 1300); return; }
    if (++pos < seq.length) return;
    ok = false;
    if (seq.length >= GOAL) { setTimeout(() => live() && finishQuest("memory"), 500); return; }
    say("Great!"); seq.push(rnd()); document.getElementById("mr").textContent = seq.length;
    setTimeout(() => live() && play(), 1000);
  });
  document.getElementById("back").onclick = () => { memRun++; questScreen(); };
  setTimeout(() => live() && play(), 300);
}

// ----- Maze Runner: a new maze every time; walls stop you; grab the key, then reach the exit -----
function startMaze(o = {}) {
  closeOverlay();
  const CS = 40, ox = 40, oy = 112, cols = Math.max(12, Math.floor((W - 80) / CS)), rows = 10, T = 6;
  const cells = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({ n: true, s: true, e: true, w: true, v: false })));
  const stack = [[0, 0]]; cells[0][0].v = true;
  while (stack.length) {   // recursive backtracker: carves a maze with exactly one route between any two cells
    const [cx, cy] = stack[stack.length - 1], nb = [];
    if (cy > 0 && !cells[cy - 1][cx].v) nb.push([cx, cy - 1, "n", "s"]);
    if (cy < rows - 1 && !cells[cy + 1][cx].v) nb.push([cx, cy + 1, "s", "n"]);
    if (cx > 0 && !cells[cy][cx - 1].v) nb.push([cx - 1, cy, "w", "e"]);
    if (cx < cols - 1 && !cells[cy][cx + 1].v) nb.push([cx + 1, cy, "e", "w"]);
    if (!nb.length) { stack.pop(); continue; }
    const [nx, ny, a, b] = nb[Math.floor(Math.random() * nb.length)];
    cells[cy][cx][a] = false; cells[ny][nx][b] = false; cells[ny][nx].v = true; stack.push([nx, ny]);
  }
  const walls = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = ox + c * CS, y = oy + r * CS, cell = cells[r][c];
    if (cell.n) walls.push([x - T / 2, y - T / 2, CS + T, T]);
    if (cell.w) walls.push([x - T / 2, y - T / 2, T, CS + T]);
    if (r === rows - 1 && cell.s) walls.push([x - T / 2, y + CS - T / 2, CS + T, T]);
    if (c === cols - 1 && cell.e) walls.push([x + CS - T / 2, y - T / 2, T, CS + T]);
  }
  const key = { c: Math.floor(cols * 0.45 + Math.random() * cols * 0.4), r: Math.floor(Math.random() * rows) };
  Q = { kind: "maze", qid: o.id || "maze", x: ox + CS / 2, y: oy + CS / 2, face: 1, t: (o.dur || 80) * 60, cool: 0, pops: [], CS, ox, oy, cols, rows, walls, key, hasKey: false, heatText: "" };
  scene = "quest"; setKeys("quest"); Sound.music("shop");
}
function mazeHit(x, y) {
  const r = 11;
  for (const [wx, wy, ww, wh] of Q.walls) { const cx = Math.max(wx, Math.min(x, wx + ww)), cy = Math.max(wy, Math.min(y, wy + wh)); if ((x - cx) * (x - cx) + (y - cy) * (y - cy) < r * r) return true; }
  return false;
}
function updateMaze(vx, vy) {
  const sp = 0.72;   // the maze is tight, so everyone walks a bit slower than in the open rooms
  if (vx && !mazeHit(Q.x + vx * sp, Q.y)) Q.x += vx * sp;
  if (vy && !mazeHit(Q.x, Q.y + vy * sp)) Q.y += vy * sp;
  const kx = Q.ox + (Q.key.c + 0.5) * Q.CS, ky = Q.oy + (Q.key.r + 0.5) * Q.CS;
  if (!Q.hasKey && Math.hypot(Q.x - kx, Q.y - ky) < 20) { Q.hasKey = true; Sound.coin(); qpop("KEY!", Q.x, Q.y - 70, "#ffc93c"); }
  const ex = Q.ox + (Q.cols - 0.5) * Q.CS, ey = Q.oy + (Q.rows - 0.5) * Q.CS;
  if (Math.hypot(Q.x - ex, Q.y - ey) < 22) {
    if (Q.hasKey) { const id = Q.qid; endQuest(() => finishQuest(id)); return; }
    else if (Q.cool <= 0) { Q.cool = 90; Sound.buzz(); qpop("NEED THE KEY!", Q.x, Q.y - 70, "#ff4d6a"); }
  }
  if (Q.t <= 0) { const id = Q.qid; endQuest(() => failQuest(id, "Time's up! Try different turns: dead ends are the maze's favourite trick.")); }
}
function drawMaze() {
  ctx.fillStyle = "#1c1736"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#2a2348"; ctx.fillRect(Q.ox, Q.oy, Q.cols * Q.CS, Q.rows * Q.CS);
  for (let r = 0; r < Q.rows; r++) for (let c = 0; c < Q.cols; c++) if ((r + c) % 2) { ctx.fillStyle = "#2f2750"; ctx.fillRect(Q.ox + c * Q.CS, Q.oy + r * Q.CS, Q.CS, Q.CS); }
  // exit
  const ex = Q.ox + (Q.cols - 0.5) * Q.CS, ey = Q.oy + (Q.rows - 0.5) * Q.CS;
  ctx.fillStyle = Q.hasKey ? "#9be22d" : "#6a5a3a"; roundRect(ex - 15, ey - 15, 30, 30, 6); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "800 12px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.fillText(Q.hasKey ? "EXIT" : "LOCK", ex, ey + 4);
  // key
  if (!Q.hasKey) { const kx = Q.ox + (Q.key.c + 0.5) * Q.CS, ky = Q.oy + (Q.key.r + 0.5) * Q.CS + Math.sin(frame / 10) * 2; ctx.strokeStyle = "#ffc93c"; ctx.fillStyle = "#ffc93c"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(kx - 5, ky, 6, 0, 7); ctx.stroke(); ctx.fillRect(kx, ky - 2, 14, 4); ctx.fillRect(kx + 9, ky, 3, 6); }
  ctx.fillStyle = "#c8c0ff";
  for (const [x, y, w, h] of Q.walls) { ctx.fillRect(x, y, w, h); }
  ctx.fillStyle = "#8a80e0";
  for (const [x, y, w, h] of Q.walls) { ctx.fillRect(x + 1, y + 1, Math.max(1, w - 2), Math.max(1, h - 2) > 3 ? 2 : 1); }
}

// ----- the Maths Chest (no fighting, just thinking) -----
function mathGame() {
  const rnd = n => 1 + Math.floor(Math.random() * n), qs = [];
  for (let i = 0; i < 4; i++) {
    let text, ans; const t = i % 3;
    if (t === 0) { const a = rnd(20) + 5, b = rnd(20) + 5; text = `${a} + ${b}`; ans = a + b; }
    else if (t === 1) { const a = rnd(30) + 20, b = rnd(15); text = `${a} - ${b}`; ans = a - b; }
    else { const a = rnd(9) + 2, b = rnd(9) + 2; text = `${a} \u00D7 ${b}`; ans = a * b; }
    const opts = new Set([ans]); while (opts.size < 4) { const o = ans + (Math.random() < 0.5 ? -1 : 1) * rnd(9); if (o > 0) opts.add(o); }
    qs.push({ text, ans, opts: [...opts].sort(() => Math.random() - 0.5) });
  }
  let i = 0;
  const show = (note = "", color = "var(--heart)") => {
    const q = qs[i];
    overlay(`<h2>\u{1F9EE} Question ${i + 1} of 4</h2><p class="sub" style="font-size:clamp(28px,6vw,56px);color:var(--fg);font-family:var(--display)">${q.text} = ?</p>
      <p class="sub note" style="color:${color}">${note}</p>
      <div class="row">${q.opts.map(o => `<button class="btn alt riddle" data-a="${o}">${o}</button>`).join("")}</div>
      <button class="btn alt" id="back">Back to quests</button>`);
    ov.querySelectorAll(".riddle").forEach(b => b.onclick = () => {
      if (+b.dataset.a === q.ans) { Sound.coin(); if (++i >= 4) finishQuest("maths"); else show("Correct! Next one...", "#9be22d"); }
      else { Sound.buzz(); show("Not quite. Try again!"); }
    });
    document.getElementById("back").onclick = () => questScreen();
  };
  show();
}

  ctx.textAlign = "right"; ctx.font = "800 18px Nunito, sans-serif"; ctx.fillStyle = "#fff"; ctx.fillText(`${save.coins} coins  ·  Rank ${rankName(rankIdx())}`, W - 40, 44);
  ctx.textAlign = "center"; ctx.font = "800 16px Nunito, sans-serif"; ctx.fillStyle = "#a59fc4"; ctx.fillText("WASD or arrows to walk  ·  E to use a stall or brawl  ·  Esc for the shop menu", W / 2, H - 8);
  if (Mk.near) { const t = Mk.near, label = t.kind === "stall" ? t.s.name : (t.n.cool > 0 ? "Resting..." : "STREET BRAWL"); ctx.textAlign = "center"; ctx.fillStyle = "#ffe14d"; ctx.font = "800 22px Nunito, sans-serif"; ctx.fillText(`PRESS E  \u00B7  ${label}`, W / 2, 44); }
  ctx.font = "22px Bungee, Impact, sans-serif"; ctx.lineWidth = 5;
  for (const p of Mk.pops) { ctx.globalAlpha = Math.max(0, 1 - p.t / 70); ctx.strokeStyle = "#000"; ctx.strokeText(p.text, p.x, p.y - p.t * 0.6); ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y - p.t * 0.6); }
  ctx.globalAlpha = 1;
}

// ===================== LOOP =====================
let frame = 0, last = performance.now(), acc = 0;
function loop(now) {
  try {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) {
      acc -= 1000 / 60; frame++;
      if (scene === "fight" && F && ov.hidden) updateFight();
      else if (scene === "quest" && Q && ov.hidden) updateQuest();
      else if (scene === "market" && Mk && ov.hidden) updateMarket();
      pressed.clear();
    }
    ctx.clearRect(0, 0, W, H);
    if (scene === "fight" && F) drawFight();
    else if (scene === "quest" && Q) drawQuest();
    else if (scene === "market" && Mk) drawMarket();
    else drawBackdrop();
  } catch (e) { console.error(e); acc = 0; }   // an error in one frame is reported, but never stops the game
  requestAnimationFrame(loop);
}
advReady = true;
titleScreen();
requestAnimationFrame(loop);
</script>
