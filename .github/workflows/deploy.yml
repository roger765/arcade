name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout arcade
        uses: actions/checkout@v4

      - name: Checkout Bloons
        uses: actions/checkout@v4
        with:
          repository: roger765/Monkey-Bloons-Tower-Defence
          path: _games/bloons

      - name: Checkout Unleashed
        uses: actions/checkout@v4
        with:
          repository: roger765/Unleashed
          path: _games/unleashed

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Bloons
        working-directory: _games/bloons
        run: npm ci && npm run build

      - name: Build Unleashed
        working-directory: _games/unleashed
        run: npm ci && npm run build
        env:
          VITE_WS_URL: ${{ secrets.UNLEASHED_WS_URL }}

      - name: Assemble dist
        run: |
          mkdir -p dist/bloons dist/unleashed
          cp -r _games/bloons/dist/. dist/bloons/
          cp -r _games/unleashed/dist/. dist/unleashed/
          cp index.html dist/index.html
          cp vercel.json dist/vercel.json

      - name: Deploy to Vercel
        working-directory: dist
        run: npx vercel@latest deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
