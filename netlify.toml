[build]
  publish = "dist"
  command = ""

# Route /bloons and /bloons/* to the Bloons SPA
[[redirects]]
  from = "/bloons"
  to = "/bloons/index.html"
  status = 200

[[redirects]]
  from = "/bloons/*"
  to = "/bloons/index.html"
  status = 200

# Route /unleashed and /unleashed/* to the Unleashed SPA
[[redirects]]
  from = "/unleashed"
  to = "/unleashed/index.html"
  status = 200

[[redirects]]
  from = "/unleashed/*"
  to = "/unleashed/index.html"
  status = 200
